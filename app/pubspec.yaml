name: easyprivacy
description: Connect securely to your own EasyPrivacy core.
publish_to: none
version: 1.0.0+7
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  cryptography: 2.9.0
  ffi: 2.2.0
  flutter_secure_storage: 11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/easyprivacy-mark.png
    - assets/native-licenses.txt
